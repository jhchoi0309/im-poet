name: CLI compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli-discovery:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned vendor CLIs
        run: npm install --global @openai/codex@0.166.0 @google/gemini-cli@0.68.0 @anthropic-ai/claude-code@2.1.325
      - name: Check CLI startup
        run: |
          codex --version
          gemini --version
          claude --version
      - name: Verify Codex skill discovery
        run: |
          python scripts/install.py --target codex --project "$RUNNER_TEMP/impoet-codex"
          python scripts/probe_codex_skill.py "$RUNNER_TEMP/impoet-codex"
      - name: Verify Gemini skill discovery
        run: |
          python scripts/install.py --target gemini
          gemini skills list --all > "$RUNNER_TEMP/gemini-skills.txt"
          cat "$RUNNER_TEMP/gemini-skills.txt"
          python -c "import os,pathlib,re; text=(pathlib.Path(os.environ['RUNNER_TEMP'])/'gemini-skills.txt').read_text(encoding='utf-8'); expected=str(pathlib.Path.home()/'.gemini'/'skills'/'im-poet'/'SKILL.md'); assert re.search(r'(?m)^im-poet\s+\[Enabled\]', text) and expected in text, 'Expected enabled user skill was not discovered'"
