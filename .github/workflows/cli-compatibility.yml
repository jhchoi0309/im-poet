name: Nine CLI and OS combinations

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli-compatibility:
    name: ${{ matrix.agent }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        agent: [codex, claude, gemini]
        include:
          - agent: codex
            package: '@openai/codex@0.166.0'
          - agent: claude
            package: '@anthropic-ai/claude-code@2.1.325'
          - agent: gemini
            package: '@google/gemini-cli@0.68.0'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install the selected pinned CLI
        run: npm install --global '${{ matrix.package }}'
      - name: Verify installation, upgrade, tools, and available discovery
        run: python scripts/verify_agent.py --host ${{ matrix.agent }} --root "${{ runner.temp }}/impoet-${{ matrix.agent }}" --discovery --report "${{ runner.temp }}/compatibility-${{ matrix.agent }}.json"
      - name: Retain the actual verification scope
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-${{ matrix.agent }}-${{ matrix.os }}
          path: ${{ runner.temp }}/compatibility-${{ matrix.agent }}.json
          if-no-files-found: warn
